<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史截图系统</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .card img { width: 100%; height: 160px; object-fit: cover; display: block; transition: 0.3s; }
        .card img:hover { transform: scale(1.05); }
        .card .info { padding: 10px; text-align: center; font-size: 14px; color: #555; }
        .loading { text-align: center; padding: 50px; font-size: 18px; color: #666; }
    </style>
</head>
<body>
    <h1>📊 数据历史截图查看器</h1>
    <div class="loading" id="loading">正在获取历史记录，请稍候...</div>
    <div class="gallery" id="gallery"></div>

    <script>
        // 你的 GitHub 仓库信息
        const user = 'lvhongyan11';
        const repo = 'my-shots';
        
        async function loadImages() {
            try {
                // 去 GitHub 读取 shots 文件夹里的所有文件
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/shots`);
                
                if (!response.ok) {
                    document.getElementById('loading').innerText = "暂无历史记录，等待第一次自动截图...";
                    return;
                }

                const files = await response.json();
                const gallery = document.getElementById('gallery');
                document.getElementById('loading').style.display = 'none';

                // 按时间倒序排列（最新的在前面）
                files.sort((a, b) => b.name.localeCompare(a.name));

                files.forEach(file => {
                    if (file.name.endsWith('.png')) {
                        // 提取时间（例如把 20231115_140000.png 变成 2023-11-15 14:00）
                        const rawTime = file.name.replace('.png', '');
                        const dateStr = rawTime.split('_')[0];
                        const timeStr = rawTime.split('_')[1];
                        const formattedTime = `${dateStr.slice(0,4)}-${dateStr.slice(4,6)}-${dateStr.slice(6,8)} ${timeStr.slice(0,2)}:${timeStr.slice(2,4)}`;

                        // 使用 jsDelivr 加速访问图片
                        const imgUrl = `./shots/${file.name}`;

                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <a href="${imgUrl}" target="_blank">
                                <img src="${imgUrl}" alt="截图" loading="lazy">
                            </a>
                            <div class="info">${formattedTime}</div>
                        `;
                        gallery.appendChild(card);
                    }
                });
            } catch (err) {
                document.getElementById('loading').innerText = "加载失败，请刷新重试";
            }
        }
        loadImages();
    </script>
</body>
</html>
